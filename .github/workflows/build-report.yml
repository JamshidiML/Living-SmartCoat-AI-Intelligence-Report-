name: Build Living SmartCoat PDF

on:
  push:
    branches:
      - main
    paths:
      - "report/**"
      - "governance/**"
      - "knowledge/**"
      - "intelligence/**"
      - "strategy/**"
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - "styles/**"
      - "requirements.txt"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: living-smartcoat-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build PDF
        run: python scripts/build_report.py

      - name: Verify PDF
        run: |
          test -s dist/SmartCoat_AI_Intelligence_Report_2026.pdf
          ls -lh dist/SmartCoat_AI_Intelligence_Report_2026.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: SmartCoat-AI-Intelligence-Report-2026
          path: dist/SmartCoat_AI_Intelligence_Report_2026.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Commit refreshed living PDF
        run: |
          git config user.name "smartcoat-report-bot"
          git config user.email "smartcoat-report-bot@users.noreply.github.com"
          git add dist/SmartCoat_AI_Intelligence_Report_2026.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current."
          else
            git commit -m "build: refresh living intelligence PDF"
            git push
          fi
